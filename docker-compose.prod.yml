name: bingo-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bingo}:${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD in .env.prod setzen}@postgres:5432/${POSTGRES_DB:-bingo}
      SESSION_SECRET: ${SESSION_SECRET}
      WEB_ORIGIN: https://${DOMAIN}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_REDIRECT_URI: https://${DOMAIN}/auth/twitch/callback
      PORT: 3001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bingo.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.bingo.entrypoints=websecure"
      - "traefik.http.routers.bingo.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.bingo.loadbalancer.server.port=3001"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD in .env.prod setzen}
      POSTGRES_DB: ${POSTGRES_DB:-bingo}
    volumes:
      - bingo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bingo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  default:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

volumes:
  bingo_postgres_data:
